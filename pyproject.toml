# Repo-root config for tools that span both Python services.
# Each service still has its own pyproject.toml for its package definition.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "**/.venv",
    "**/artifacts",
    "**/cache",
    "**/node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI uses Depends() in defaults
]

[tool.ruff.format]
quote-style = "double"
