name: Feature request
description: Propose a new feature or enhancement
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - amm-clearing-node
        - amm-execution-node
        - amm-smart-contract
        - cross-component
        - documentation
        - tooling / CI
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's the user-facing or research problem this would solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you approach it? API sketches, formulas, or interface changes welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they're worse.
