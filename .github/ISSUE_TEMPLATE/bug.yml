name: Bug report
description: Report something that is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - amm-clearing-node
        - amm-execution-node
        - amm-smart-contract
        - docker-compose / repo-wide
        - documentation
        - not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or order payloads that trigger the issue.
      placeholder: |
        1. `docker compose up`
        2. POST /trigger-clearing with payload ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste any relevant logs, stack traces, or transaction hashes. Will be rendered as code.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or the release tag you are on.
    validations:
      required: true
