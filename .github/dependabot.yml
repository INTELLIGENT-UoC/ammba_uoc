version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]

  - package-ecosystem: "pip"
    directory: "/amm-clearing-node"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "clearing-node"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/amm-execution-node"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "execution-node"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/amm-smart-contract"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "contract"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    # Hardhat 3 is a major rewrite — migration tracked separately.
    # Keep getting minor/patch + security advisories on the 2.x line.
    ignore:
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-toolbox"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/amm-clearing-node"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/amm-execution-node"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
