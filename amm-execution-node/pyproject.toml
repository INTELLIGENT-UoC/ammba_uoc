[project]
name = "amm-execution-node"
version = "0.1.0"
description = "AMMBA Execution Engine - on-chain settlement of AMM matches (v2); future penalty path"
requires-python = ">=3.11"
dependencies = [
    "web3>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
