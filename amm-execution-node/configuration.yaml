application:
  host: "0.0.0.0"
  port: 8082

offchain_db:
  base_url: "http://localhost:8080"

market:
  time_slot_sec: 900
  execution_offset_min: -120      # Run 2h after delivery start
  polling_interval_sec: 300       # Check every 5 minutes

penalties:
  gamma: 1.1                      # Shortfall penalty multiplier (K_sho = gamma * K_upper)
  eta: 0.0                        # Tolerance threshold (kWh)

communities:
  communityid_1:
    k_upper_ct_per_kwh: 28.5
    k_lower_ct_per_kwh: 8.0
    theta: 1.0
    steepness: 2.5
