site_name: AMMBA
site_description: >-
  Documentation of AMMBA, the Automated Market Maker for Batch Auctions: an
  AMM-based trading mechanism for local energy communities, developed in the
  Horizon Europe project INTELLIGENT.
site_url: https://intelligent-uoc.github.io/ammba_uoc/
repo_url: https://github.com/INTELLIGENT-UoC/ammba_uoc
repo_name: INTELLIGENT-UoC/ammba_uoc
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 INTELLIGENT-UoC and AMMBA contributors &middot; GPL-3.0-or-later

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Sources that live next to the pages but are not part of the site.
exclude_docs: |
  assets/figures/make_figures.py
  requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Quick start: getting-started/quickstart.md
      - Self-hosting a community: getting-started/self-hosting.md
  - Market mechanism:
      - model/index.md
      - Market design and positioning: background/market-design.md
      - Pricing function: model/pricing.md
      - Allocation and gains from trade: model/allocation.md
      - Parameter calibration: model/calibration.md
      - Parameter governance: model/governance.md
      - Incentives and penalties: model/incentives.md
      - Preferences and differential pricing: model/extensions.md
  - Evaluation: model/evaluation.md
  - Implementation:
      - Architecture: implementation/architecture.md
      - Clearing engine: implementation/clearing-engine.md
      - Calibration tool: implementation/calibration-tool.md
      - Settlement engine: implementation/settlement-engine.md
      - Audit anchor contract: implementation/smart-contract.md
      - Testing and verification: implementation/testing.md
  - Integration:
      - integration/index.md
      - EWDS transport: integration/ewds.md
      - Data model and identifiers: integration/data-model.md
  - Reference:
      - Configuration: reference/configuration.md
      - Interfaces and tools: reference/interfaces.md
      - Notation: model/notation.md
      - Glossary: reference/glossary.md
      - Publications and references: reference/bibliography.md
  - Contributing: project/contributing.md
